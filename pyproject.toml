[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "blankly"
version = "1.18.25b0"
description = "Rapidly build, backtest & deploy trading bots"
readme = "README.md"
requires-python = ">=3.13,<3.16"
license = {text = "LGPL-3.0"}
authors = [
    {name = "blankly", email = "contact@blankly.finance"},
]
keywords = ["Crypto", "Stocks", "Quantitative Finance", "Exchanges", "Bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "questionary>=2.1.1",
    "yaspin>=3.5.1",
    "bokeh>=3.10.0",
    "dateparser>=1.4.3",
    "numpy>=2.4.2",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "websocket-client>=1.9.2",
    "msgpack==1.0.3",
]

[project.optional-dependencies]
alpaca = [
    "alpaca-trade-api>=3.2.0",
]
binance = [
    "python-binance>=1.0.37",
]
indicators = [
    "octobot-tulipy>=0.4.11b13",
]
all = [
    "python-binance>=1.0.37",
]

[project.scripts]
blankly_old = "blankly.deployment.cli:main"
blankly = "blankly.deployment.new_cli:main"

[project.urls]
Homepage = "https://github.com/Blankly-Finance/Blankly"

[tool.hatch.build.targets.wheel]
packages = ["src/blankly"]

[tool.hatch.build.targets.sdist]
include = [
    "src/blankly/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "tests/**",
    "examples/**",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["blankly"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]


[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-mock>=3.16.0"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
octobot-tulipy = { path = "../OctoBot/vendor/octobot-tulipy" }
